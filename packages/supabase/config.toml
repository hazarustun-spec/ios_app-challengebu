project_id = "tennis-challenger"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# "exp://127.0.0.1:8081" is scoped to local Expo dev server only.
# Production redirect URLs must be set in the Supabase dashboard and must NOT include a bare "exp://".
additional_redirect_urls = ["exp://127.0.0.1:8081", "tennischallenger://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6

# Branded OTP emails: deliver the 6-digit {{ .Token }} code (not a magic link),
# so the app's 6-box OTP screen works. Unlocked once custom SMTP (Brevo) is set.
[auth.email.template.confirmation]
subject = "ChallengeBu! giriş kodun"
content_path = "./supabase/templates/otp-code.html"

[auth.email.template.magic_link]
subject = "ChallengeBu! giriş kodun"
content_path = "./supabase/templates/otp-code.html"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
inspector_port = 8083

# review-login is called by the App Store reviewer before they have a session,
# so it must accept unauthenticated requests. It gates itself: only the review
# email + the fixed REVIEW_OTP_CODE secret can mint a session.
[functions.review-login]
verify_jwt = false

# Functions the DATABASE calls through pg_net. Each is authenticated by its own
# code — the Bearer must equal INTERNAL_PUSH_KEY, which is not a JWT, so the
# gateway's JWT check has to be off or every trigger-driven call is rejected as
# "Invalid JWT" before the function runs.
#
# These were live with the check off, but nothing in the repo said so: the
# setting existed only on the platform, left there by earlier deploys with
# --no-verify-jwt. A new function deployed without the flag (admin-record-match)
# silently got the check ON and failed that way. Declared here, a plain
# `supabase functions deploy` can no longer flip any of them.
[functions.dispatch-push]
verify_jwt = false

[functions.push-live-score]
verify_jwt = false

[functions.start-opponent-activity]
verify_jwt = false

# Also accepts a signed-in admin, whose JWT the function verifies itself via
# requireAdmin (auth.getUser + role check).
[functions.admin-record-match]
verify_jwt = false
