project_id = "tennis-challenger"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# "exp://127.0.0.1:8081" is scoped to local Expo dev server only.
# Production redirect URLs must be set in the Supabase dashboard and must NOT include a bare "exp://".
additional_redirect_urls = ["exp://127.0.0.1:8081", "tennischallenger://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
inspector_port = 8083
