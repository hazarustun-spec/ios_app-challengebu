# Login via email OTP (account A = alice) → lands on onboarding (new user).
# NOTE: the QUICK_DOMAINS chip row was removed from the sign-in screen; the
# `tapOn` on a domain chip no longer applies. inputText writes into the
# focused email field on its own.
appId: app.challengebu.ios
env:
  EMAIL: "alice@example.edu.tr"
---
- launchApp:
    clearState: true
- assertVisible: "E-postanı gir"
- inputText: ${EMAIL}
- hideKeyboard
# KVKK checkbox circle is at the far LEFT of the consent row (tapping the row
# text opens the legal link instead), so tap the checkbox by point.
- tapOn:
    point: "9%,57%"
- tapOn: "Kod gönder"
- assertVisible: "Gelen kutunu kontrol et"
- runScript: get-otp.js
# Enter the 6 digits one at a time (the boxes auto-advance focus).
- inputText: ${output.d0}
- inputText: ${output.d1}
- inputText: ${output.d2}
- inputText: ${output.d3}
- inputText: ${output.d4}
- inputText: ${output.d5}
- waitForAnimationToEnd
- takeScreenshot: 01c-after-otp
