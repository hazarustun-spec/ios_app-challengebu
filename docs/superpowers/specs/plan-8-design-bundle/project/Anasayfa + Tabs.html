<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tennis Challenger — Anasayfa + Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/tokens.css" />
<style>
  html, body { margin: 0; height: 100%; background: #EDEDEA; }
  #root { min-height: 100%; }
</style>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#fff"/>
    <rect x="20" y="18" width="60" height="26" rx="8" fill="#2270BC" stroke="#161618" stroke-width="2.5"/>
    <rect x="20" y="52" width="60" height="12" rx="6" fill="#8FD43B" stroke="#161618" stroke-width="2"/>
    <rect x="20" y="72" width="60" height="12" rx="6" fill="#161618"/>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="app/image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/doodles.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/components.jsx"></script>
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel" src="app/screens-home.jsx"></script>

<script type="text/babel">
const { Home, StatusBar, TabBar, Icon, AppCtx } = window;
const fakeNav = { go(){}, replace(){}, back(){}, reset(){}, sheet(){}, closeSheet(){}, modal(){}, closeModal(){}, toast(){} };

function Phone({ children, withTab, active }) {
  return (
    <div style={{ padding: 11, background: '#1A1A1C', borderRadius: 56, border: '1.5px solid var(--border-strong)' }}>
      <div data-theme="light" className="tc-screen" style={{ width: 393, height: 852, display: 'flex', flexDirection: 'column', background: 'var(--bg)', position: 'relative', overflow: 'hidden', borderRadius: 46 }}>
        <div style={{ position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)', width: 124, height: 35, background: '#000', borderRadius: 20, zIndex: 100 }} />
        <StatusBar dark={false} />
        <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>{children}</div>
        {withTab && <TabBar active={active} onTab={() => {}} />}
      </div>
    </div>
  );
}

function Note({ children }) {
  return <div style={{ fontSize: 12.5, color: 'var(--text-3)', fontWeight: 600, marginTop: 10, lineHeight: 1.5 }}>{children}</div>;
}

function App() {
  const TABS = [
    { label: 'Sıralama', active: 'ranking' },
    { label: 'Maçlar', active: 'matches' },
    { label: 'Bildirim (3)', active: 'notifs' },
    { label: 'Profil', active: 'profile' },
  ];
  return (
    <AppCtx.Provider value={{ nav: fakeNav, theme: 'light', setTheme(){}, dark: false }}>
      <div style={{ maxWidth: 1240, margin: '0 auto', padding: '52px 40px 90px', fontFamily: 'var(--font-sans)', color: 'var(--text)' }}>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 10 }}>
          <h1 style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 44, letterSpacing: '-.03em', margin: 0, whiteSpace: 'nowrap' }}>Anasayfa + Tabs</h1>
          <span className="num" style={{ fontWeight: 700, fontSize: 13, color: 'var(--text-2)', border: '1.5px solid var(--border-strong)', borderRadius: 'var(--r-pill)', padding: '7px 14px', whiteSpace: 'nowrap' }}>Grup 4 · v3</span>
        </div>
        <p style={{ fontSize: 16, color: 'var(--text-2)', maxWidth: 720, lineHeight: 1.55, margin: '0 0 44px' }}>Greeting + kort-mavisi ELO hero (mini trend) + Yeni Maç CTA + aktif maçlar + son sonuçlar + sezon geri sayım banner. Alt sekme çubuğu baskın merkezi “+” ile.</p>

        <div style={{ display: 'flex', gap: 56, flexWrap: 'wrap', alignItems: 'flex-start' }}>
          {/* Home screen */}
          <div>
            <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '.09em', color: 'var(--text-3)', textTransform: 'uppercase', marginBottom: 14 }}>Anasayfa</div>
            <Phone withTab active="home"><Home params={{}} /></Phone>
          </div>

          {/* Tab bar documentation */}
          <div style={{ flex: 1, minWidth: 360, maxWidth: 560 }}>
            <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '.09em', color: 'var(--text-3)', textTransform: 'uppercase', marginBottom: 14 }}>Tab bar — aktif durumlar</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              {TABS.map(t => (
                <div key={t.active}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--text-2)', marginBottom: 7 }}>{t.label}</div>
                  <div style={{ background: 'var(--bg)', border: '1.5px solid var(--border-strong)', borderRadius: 'var(--r-md)', overflow: 'hidden' }}>
                    <TabBar active={t.active} onTab={() => {}} />
                  </div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 22, padding: 18, background: 'var(--surface)', border: '1.5px solid var(--border-strong)', borderRadius: 'var(--r-md)' }}>
              <div style={{ fontWeight: 800, fontSize: 15, fontFamily: 'var(--font-display)' }}>Yapı</div>
              <Note>Lime pill zemin · aktif sekme ink daire içinde beyaz ikon · merkezi <b>“+”</b> beyaz halkalı baskın ink daire (maç oluştur) · Bildirim sekmesinde pembe badge sayacı (3) · gölge yok, 1.5px ink hat.</Note>
            </div>
          </div>
        </div>
      </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
