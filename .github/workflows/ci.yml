name: CI

on:
  push:
    branches: [main, plan-8-ui-redesign]
  pull_request:
    branches: [main, plan-8-ui-redesign]
  workflow_dispatch:

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (shared)
        working-directory: packages/shared
        run: bun run typecheck

      - name: Test (shared)
        working-directory: packages/shared
        run: bun test

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (mobile)
        working-directory: apps/mobile
        run: bun run typecheck

      - name: Test (mobile)
        working-directory: apps/mobile
        # `bun run test`, not `bun test`: the package script points at
        # scripts/test.sh, which runs one file per process. `bun test` bypasses
        # it and puts every suite back in one process, where the per-file
        # `mock.module('react-native', …)` stubs overwrite each other.
        run: bun run test

  supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Start Supabase
        working-directory: packages/supabase
        run: supabase start

      - name: Apply migrations
        working-directory: packages/supabase
        run: supabase db reset --no-seed=false

      - name: Capture Supabase env
        working-directory: packages/supabase
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r .SERVICE_ROLE_KEY)" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -r .ANON_KEY)" >> $GITHUB_ENV

      # Warms the module cache so the first request does not pay for every npm
      # download. The lockfile now lands at packages/supabase/deno.lock — see
      # functions/deno.json — because writing it inside functions/ made the
      # serve watcher restart the runtime mid-request.
      - name: Pre-cache Edge Function deps
        working-directory: packages/supabase
        run: deno cache --config functions/deno.json functions/*/index.ts

      - name: Serve Edge Functions
        working-directory: packages/supabase
        # --env-file, same as the maestro job: review-login refuses to run
        # without REVIEW_OTP_CODE and its integration test failed on every run
        # for want of a secret that is committed two directories away.
        run: nohup supabase functions serve --no-verify-jwt --env-file functions/.env.test > /tmp/functions-serve.log 2>&1 &

      - name: Wait for Edge Functions ready
        run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:54321/functions/v1/ -o /dev/null; then
              echo "Functions ready after ${i}s"
              exit 0
            fi
            # 401 also means the runtime is up; only "connection refused" means not started.
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/ || echo 0)
            if [ "$status" != "0" ] && [ "$status" != "000" ]; then
              echo "Functions ready (status $status) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Edge Functions did not become ready within 60s"
          cat /tmp/functions-serve.log
          exit 1

      - name: Verify schema
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f packages/supabase/tests/schema-verification.sql

      - name: Run pgTAP database tests
        working-directory: packages/supabase
        run: bun run test:db

      - name: Run Edge Function integration tests (deno)
        working-directory: packages/supabase
        run: deno test --config functions/deno.json --allow-net --allow-env --allow-read 'tests/functions/*.deno-test.ts'

      - name: Dump function logs on failure
        if: failure()
        run: cat /tmp/functions-serve.log || true

      - name: Stop Supabase
        if: always()
        working-directory: packages/supabase
        run: supabase stop

  # Maestro E2E — macOS runner + iOS Simulator. Runs review-login (no Mailpit).
  # Full ci-suite needs a simulator build installed first (see apps/mobile/scripts/maestro-ci.sh).
  #
  # MANUAL ONLY (workflow_dispatch), by choice rather than by breakage.
  #
  # GitHub's macOS runners ship no container runtime, so `supabase start` used
  # to die at step three with `docker: command not found` — on every push, after
  # booting a simulator, for up to 90 minutes of macOS runner time, and it kept
  # the whole workflow red, which hid the three failures that were real. The
  # colima step below fixes that.
  #
  # It stays on workflow_dispatch because of cost, not capability: macOS minutes
  # bill at 10x, and this lane boots colima, pulls the Supabase images, builds
  # the app for the simulator and drives it. Run it before a release, or when
  # touching an onboarding/auth flow — not on every commit.
  maestro-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # GitHub's macOS runners ship no container runtime (Docker Desktop's
      # licence keeps it off the image), and `supabase start` needs one:
      #   failed to inspect container health: docker: command not found
      # colima is the runnable substitute. It is slow to come up — several
      # minutes — which is a large part of why this job stays manual.
      - name: Install a container runtime (colima)
        run: |
          brew install docker colima qemu
          # --vm-type qemu, not the default vz: Virtualization.framework fails
          # to start a VM on these runners —
          #   error starting vm: error at 'creating and starting': exit status 1
          # — right after the disk resize. qemu is slower but boots.
          colima start --vm-type qemu --cpu 3 --memory 8 --disk 20
          docker info

      - name: Setup Java 17 (Maestro)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Supabase + reset DB
        working-directory: packages/supabase
        run: |
          supabase start
          supabase db reset --no-seed=false

      - name: Serve Edge Functions (review-login secret)
        working-directory: packages/supabase
        run: |
          nohup supabase functions serve --no-verify-jwt --env-file functions/.env.test \
            > /tmp/functions-serve.log 2>&1 &
          for i in {1..90}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/ || echo 0)
            if [ "$code" != "0" ] && [ "$code" != "000" ]; then echo "Functions ready"; exit 0; fi
            sleep 1
          done
          cat /tmp/functions-serve.log
          exit 1

      - name: Capture local Supabase env for the app build
        working-directory: packages/supabase
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(supabase status --output json | jq -r .ANON_KEY)" >> $GITHUB_ENV

      - name: Build and install on iOS Simulator
        working-directory: apps/mobile
        env:
          CI: "1"
        run: |
          xcrun simctl boot "iPhone 16" 2>/dev/null || true
          npx expo run:ios --simulator "iPhone 16"

      - name: Maestro review-login
        working-directory: apps/mobile
        run: maestro test .maestro/review-login.yaml

      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/functions-serve.log || true
