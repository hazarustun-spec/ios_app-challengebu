name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (shared)
        working-directory: packages/shared
        run: bun run typecheck

      - name: Test (shared)
        working-directory: packages/shared
        run: bun test

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (mobile)
        working-directory: apps/mobile
        run: bun run typecheck

      - name: Test (mobile)
        working-directory: apps/mobile
        run: bun test

  supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Start Supabase
        working-directory: packages/supabase
        run: supabase start

      - name: Apply migrations
        working-directory: packages/supabase
        run: supabase db reset --no-seed=false

      - name: Capture Supabase env
        working-directory: packages/supabase
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r .SERVICE_ROLE_KEY)" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -r .ANON_KEY)" >> $GITHUB_ENV

      - name: Serve Edge Functions
        working-directory: packages/supabase
        run: nohup supabase functions serve --no-verify-jwt > /tmp/functions-serve.log 2>&1 &

      - name: Wait for Edge Functions ready
        run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:54321/functions/v1/ -o /dev/null; then
              echo "Functions ready after ${i}s"
              exit 0
            fi
            # 401 also means the runtime is up; only "connection refused" means not started.
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/ || echo 0)
            if [ "$status" != "0" ] && [ "$status" != "000" ]; then
              echo "Functions ready (status $status) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Edge Functions did not become ready within 60s"
          cat /tmp/functions-serve.log
          exit 1

      - name: Verify schema
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f packages/supabase/tests/schema-verification.sql

      - name: Run pgTAP database tests
        working-directory: packages/supabase
        run: bun run test:db

      - name: Run Edge Function integration tests (deno)
        working-directory: packages/supabase
        run: deno test --config functions/deno.json --allow-net --allow-env --allow-read 'tests/functions/*.deno-test.ts'

      - name: Dump function logs on failure
        if: failure()
        run: cat /tmp/functions-serve.log || true

      - name: Stop Supabase
        if: always()
        working-directory: packages/supabase
        run: supabase stop

  # Optional Maestro E2E job — DISABLED by default (`if: false`).
  #
  # This is intentionally a non-gating stub: enabling it requires a macOS
  # runner that the hosted CI does not currently provide. To run it you need:
  #   1. A macOS runner (`runs-on: macos-latest`) with Xcode + an iOS Simulator.
  #   2. A simulator build of the app installed + booted
  #      (e.g. `npx expo run:ios` from apps/mobile; eas `dev` profile is
  #      simulator-enabled).
  #   3. The local Supabase stack running (`supabase start`) so the app can
  #      talk to the backend.
  #   4. A signed-in session: Maestro cannot drive the magic-link / email-OTP
  #      login, so resolve auth via the Mailpit inbox (Inbucket on
  #      http://127.0.0.1:54324) — fetch the OTP from the local mail server —
  #      or inject a Supabase session for a password-auth test user.
  #   5. A 0-0 `MATCH_ID` the signed-in user participates in, created via
  #      SQL/API in a setup step, then:
  #        maestro test -e MATCH_ID=<uuid> apps/mobile/.maestro/score-undo.yaml
  #
  # Flip `if:` to a real condition (or remove the guard) once a macOS runner
  # with the auth flow is wired up. CI must NOT hard-fail on Maestro until then.
  maestro-e2e:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Maestro E2E (stub — see job comment for prerequisites)
        run: |
          echo "Maestro E2E is a documented stub; see the job comment in ci.yml."
          echo "Needs: macOS runner + simulator build + local Supabase stack + Mailpit OTP auth."
          exit 0
