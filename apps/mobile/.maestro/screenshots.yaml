# screenshots.yaml — App Store screenshot capture, prod-backed.
#
# Uses the App Store review demo mailbox (appreview42@proton.me): the client
# routes that address through the fixed-code review-login Edge Function, so it
# signs in without an OTP mailbox — perfect for headless screenshotting.
#
# Prereqs:
#   - The bundle is installed on an iOS Simulator (`eas build:run --profile
#     simulator --platform ios --latest`) and the sim device is iPhone 16 Pro
#     Max (6.9") to match Apple's required screenshot resolution.
#   - JDK 17+ on PATH.
#
# Run:
#   JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \
#   maestro test .maestro/screenshots.yaml
appId: app.challengebu.ios
env:
  EMAIL: "appreview42@proton.me"
---
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- tapOn:
    text: "Aç"
    optional: true

# Log in if the Welcome screen is showing (session may already exist from a
# previous run — reuse it in that case).
- runFlow:
    when:
      visible: "Üniversite e-postanla başla"
    commands:
      - tapOn: "Üniversite e-postanla başla"
      - assertVisible: "E-postanı gir"
      - inputText: ${EMAIL}
      - hideKeyboard
      - tapOn: "KVKK onayı"
      # The review-login shortcut signs the demo account in on a single tap,
      # so the CTA reads "Devam et" (not "Kod gönder") and the OTP screen is
      # skipped entirely.
      - tapOn: "Devam et"

# Dismiss the iOS notification-permission dialog if it pops up.
- tapOn:
    text: "İzin Ver"
    optional: true
- tapOn:
    text: "İzin Verme"
    optional: true

# ── Home / Sıralama (leaderboard) ──
- extendedWaitUntil:
    visible: "Sıralama"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: shots/01-siralama

# ── Maçlar ──
- tapOn: "Maçlar"
- waitForAnimationToEnd
- takeScreenshot: shots/02-maclar

# ── Profil ──
- tapOn: "Profil"
- waitForAnimationToEnd
- takeScreenshot: shots/03-profil

# ── Yeni Maç oluştur ──
- tapOn:
    id: "new-match"
    optional: true
- tapOn:
    text: "Yeni Maç"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: shots/04-yeni-mac
